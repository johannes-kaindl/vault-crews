<!doctype html>
<html lang="de"><head><meta charset="utf-8"><title>vault-crews Panel-Harness</title>
<link rel="stylesheet" href="../../styles.css">
<style>
/* Näherung der Obsidian-CSS-Variablen (Dark), damit das Plugin-CSS greift wie dort.
   Bewusst KEIN Obsidian-Theme — was hier sichtbar ist, ist die Wirkung von styles.css. */
:root{
  --text-normal:#dadada; --text-muted:#b3b3b3; --text-faint:#7a7a7a; --text-on-accent:#fff;
  --text-error:#e75545; --text-success:#4caf50; --text-accent:#a882ff;
  --background-primary:#1e1e1e; --background-secondary:#161616; --background-modifier-border:#333;
  --background-modifier-error:#3d1f1f; --interactive-accent:#7c3aed; --interactive-normal:#2a2a2a;
  --size-4-1:4px; --size-4-2:8px; --size-4-3:12px; --size-4-4:16px; --size-2-1:2px;
  --font-ui-smaller:12px; --font-ui-small:13px; --font-ui-medium:15px;
  --font-monospace:ui-monospace,SFMono-Regular,Menlo,monospace; --radius-s:4px; --radius-m:8px;
}
body{margin:0;background:var(--background-primary);color:var(--text-normal);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:15px}
/* Sidebar-Breite wie in Obsidian, damit Umbrüche und Höhen realistisch sind */
#panel{width:400px;height:100vh;overflow-y:auto;padding:12px;box-sizing:border-box;
  border-right:1px solid var(--background-modifier-border)}
</style></head>
<body><div id="panel"></div><script type="module" src="harness.js"></script></body></html>
